<!doctype html>
<html lang="zh-CN">
<head>

  <title>管理学 2.0｜从管人到管理 Agent + 人</title>
  <style>
    :root{--paper:#f7f7f5;--white:#fff;--ink:#202124;--muted:#6b7280;--line:#e4e5e2;--blue:#176b87;--blue-soft:#e9f3f5;--orange:#e67d5b;--max:1240px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.shell{max-width:var(--max);margin:auto;min-height:100vh;display:grid;grid-template-columns:278px minmax(0,1fr);background:var(--white);box-shadow:0 0 60px #152a3510}
    aside{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:28px 20px;background:#fbfbfa}.brand{font-size:14px;letter-spacing:.03em;font-weight:750;color:#1b2830;line-height:1.35}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:6px}.search{position:relative;margin:25px 0 20px}.search input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:white;outline:none}.search input:focus{border-color:#72aebe;box-shadow:0 0 0 3px #176b8714}.nav-label{font-size:11px;font-weight:750;letter-spacing:.1em;color:#92969b;margin:20px 0 8px;text-transform:uppercase}.nav-list{list-style:none;padding:0;margin:0}.nav-list a{display:block;padding:7px 9px;border-radius:7px;color:#46515a;font-size:13px;line-height:1.4}.nav-list a:hover,.nav-list a.active{background:var(--blue-soft);color:#155e75;text-decoration:none}.status{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:20px;background:#fff4e8;color:#925431;font-size:11px;font-weight:700}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange)}
    main{min-width:0}.topline{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px;color:var(--muted);font-size:12px}.topline a{font-weight:650}.content{max-width:850px;margin:0 auto;padding:54px 54px 100px}.hero{padding:0 0 32px;border-bottom:1px solid var(--line);margin-bottom:30px}.hero h1{font-size:clamp(34px,5vw,55px);letter-spacing:-.045em;line-height:1.12;margin:16px 0 18px;font-weight:720}.subtitle{font-size:19px;line-height:1.6;color:#47535a;max-width:700px}.hero-note{margin-top:23px;padding:14px 17px;border-left:3px solid var(--orange);background:#fff8f2;color:#674e40;font-size:13px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--blue);font-weight:760}.intro-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:26px 0 40px}.intro-card{border:1px solid var(--line);border-radius:12px;padding:19px 20px;background:#fff}.intro-card h3{margin:0 0 8px;font-size:15px}.intro-card p{margin:0;color:#646c72;font-size:13px;line-height:1.65}.section-title{font-size:22px;letter-spacing:-.02em;margin:42px 0 14px}.chapter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chapter-card{display:block;border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--ink);transition:border-color .16s,transform .16s}.chapter-card:hover{border-color:#94bdc8;transform:translateY(-1px);text-decoration:none}.chapter-card small{display:block;color:#899096;font-size:11px;margin-bottom:3px}.chapter-card strong{font-size:14px;font-weight:650}.results-meta{font-size:13px;color:var(--muted);margin:0 0 16px}.article-head{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}.article-head h1{font-size:clamp(30px,4vw,42px);line-height:1.25;letter-spacing:-.035em;margin:12px 0 8px}.article-meta{font-size:13px;color:var(--muted)}.prose{font-size:17px;line-height:1.95;color:#292d30;overflow-wrap:anywhere}.prose h1{font-size:2em;line-height:1.3;margin:1.2em 0 .55em}.prose h2{font-size:1.55em;line-height:1.35;margin:1.7em 0 .55em;padding-bottom:.3em;border-bottom:1px solid var(--line)}.prose h3{font-size:1.25em;line-height:1.4;margin:1.5em 0 .45em}.prose h4,.prose h5,.prose h6{font-size:1.08em;margin:1.3em 0 .4em}.prose p{margin:.85em 0}.prose blockquote{margin:1.2em 0;padding:.25em 1em;border-left:3px solid #75aebb;color:#657078;background:#f7fafb}.prose ul,.prose ol{padding-left:1.5em}.prose li{margin:.35em 0}.prose hr{border:0;border-top:1px solid var(--line);margin:2em 0}.prose code{font: .87em ui-monospace,SFMono-Regular,Menlo,monospace;background:#f1f3f4;border-radius:4px;padding:.15em .35em}.prose pre{overflow:auto;padding:16px;background:#f4f5f4;border-radius:8px;font-size:13px}.prose pre code{background:none;padding:0}.prose table{border-collapse:collapse;width:100%;display:block;overflow:auto;font-size:14px;line-height:1.6;margin:1.2em 0}.prose th,.prose td{padding:9px 11px;border:1px solid var(--line);text-align:left;vertical-align:top}.prose th{background:#f4f7f7;font-weight:700}.prose figure{margin:1.7em 0 2.2em;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fbfbfa}.prose figure img{display:block;width:100%;height:auto;border-radius:5px}.prose figcaption{padding:9px 5px 2px;color:var(--muted);font-size:12px;line-height:1.5}.chapter-footer{display:flex;justify-content:space-between;gap:18px;border-top:1px solid var(--line);padding-top:20px;margin-top:52px;font-size:14px}.chapter-footer a{max-width:48%}.chapter-footer a:last-child{text-align:right}.empty{padding:20px;border:1px dashed var(--line);border-radius:9px;color:var(--muted)}.mobile-menu{display:none}
    @media(max-width:800px){.shell{display:block}aside{position:relative;height:auto;max-height:38vh;border-right:0;border-bottom:1px solid var(--line);padding:18px 18px 14px}.brand{font-size:13px}.search{margin:14px 0}.nav-label{margin:12px 0 5px}.nav-list{display:flex;overflow:auto;gap:4px;padding-bottom:4px}.nav-list a{white-space:nowrap;padding:6px 9px}.topline{height:48px;padding:0 20px}.content{padding:32px 22px 72px}.intro-grid,.chapter-grid{grid-template-columns:1fr}.hero h1{font-size:36px}.subtitle{font-size:17px}.prose{font-size:16px}.chapter-footer{font-size:13px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">管理学 2.0<small>从管人到管理 Agent + 人</small></div>
      <label class="search"><input id="search" type="search" placeholder="搜索全书章节…" aria-label="搜索全书章节"></label>
      <div class="nav-label">全书目录</div>
      <ul class="nav-list" id="nav"></ul>
    </aside>
    <main>
      <div class="topline"><span id="crumb">在线阅读 · 工作稿</span><a href="./README.md">GitHub 仓库 ↗</a></div>
      <div class="content" id="content"><p>正在载入书稿…</p></div>
    </main>
  </div>
  <script>
    const chapters = [
      {part:'序章',title:'当你的下属不是人',file:'序章-当你的下属不是人.md'},
      {part:'第一部｜人的时代',title:'管理的发明',file:'ch01-管理的发明.md'},
      {part:'第一部｜人的时代',title:'组织的形成',file:'ch02-组织的形成.md'},
      {part:'第一部｜人的时代',title:'人不是机器',file:'ch03-人不是机器.md'},
      {part:'第一部｜人的时代',title:'目标与有效性',file:'ch04-目标与有效性.md'},
      {part:'第二部｜AI 进入组织',title:'新执行者',file:'ch05-新执行者.md'},
      {part:'第二部｜AI 进入组织',title:'新管理幅度',file:'ch06-新管理幅度.md'},
      {part:'第二部｜AI 进入组织',title:'岗位让位于闭环',file:'ch07-岗位让位于闭环.md'},
      {part:'第二部｜AI 进入组织',title:'从 SOP 到 Skill',file:'ch08-从SOP到Skill.md'},
      {part:'第三部｜重新设计管理',title:'自治不是二元开关',file:'ch09-自治不是二元开关.md'},
      {part:'第三部｜重新设计管理',title:'双层组织',file:'ch10-双层组织.md'},
      {part:'第三部｜重新设计管理',title:'六环管理',file:'ch11-六环管理.md'},
      {part:'第三部｜重新设计管理',title:'从 KPI 到证据链',file:'ch12-从KPI到证据链.md'},
      {part:'第三部｜重新设计管理',title:'学习系统',file:'ch13-学习系统.md'},
      {part:'第三部｜重新设计管理',title:'最后签字的人是谁',file:'ch14-最后签字的人是谁.md'},
      {part:'第四部｜AI Native 组织',title:'从 Human Native 到 AI Native',file:'ch15-从HumanNative到AINative.md'},
      {part:'第四部｜AI Native 组织',title:'企业边界重画',file:'ch16-企业边界重画.md'},
      {part:'尾声',title:'管理者的最后工作',file:'尾声-管理者的最后工作.md'}
    ];
    const content=document.querySelector('#content'), nav=document.querySelector('#nav'), search=document.querySelector('#search'), crumb=document.querySelector('#crumb');
    const cache=new Map(); let current=-1; const status='<div class="hero-note"><strong>工作稿 · draft2.2</strong><br>章节仍在作者校订中，案例、引文与事实尚未完成最终出版核验。</div>';
    const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function inline(s){let x=esc(s);x=x.replace(/!\[([^\]]*)\]\(images\/([A-Za-z0-9._-]+)\)/g,'<figure><img loading="lazy" src="./book/images/$2" alt="$1"><figcaption>$1</figcaption></figure>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');return x;}
    function renderMd(md){const lines=md.replace(/\r/g,'').split('\n');let out='',i=0;while(i<lines.length){let line=lines[i];if(!line.trim()){i++;continue}if(/^```/.test(line)){let lang=line.slice(3).trim();i++;let code=[];while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);i++;out+=`<pre><code>${esc(code.join('\n'))}</code></pre>`;continue}let image=line.match(/^!\[([^\]]*)\]\(images\/([^\s)]+)\)$/);if(image){let src='./book/images/'+encodeURIComponent(image[2]);out+=`<figure><img loading="lazy" src="${src}" alt="${esc(image[1])}"><figcaption>${esc(image[1])}</figcaption></figure>`;i++;continue}if(/^\s*---+\s*$/.test(line)){out+='<hr>';i++;continue}if(/^#{1,6}\s/.test(line)){let n=line.match(/^#+/)[0].length;out+=`<h${n}>${inline(line.slice(n).trim())}</h${n}>`;i++;continue}if(/^>\s?/.test(line)){let q=[];while(i<lines.length&&/^>\s?/.test(lines[i]))q.push(lines[i++].replace(/^>\s?/,''));out+=`<blockquote>${q.map(s=>`<p>${inline(s)}</p>`).join('')}</blockquote>`;continue}if(/^\s*\|/.test(line)){let rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i]))rows.push(lines[i++]);const cells=r=>r.split('|').slice(1,-1).map(c=>c.trim());if(rows.length>1&&/^\s*\|?\s*:?-{2,}/.test(rows[1]))rows.splice(1,1);out+='<table><tbody>'+rows.map((r,j)=>'<tr>'+cells(r).map(c=>`<${j===0?'th':'td'}>${inline(c)}</${j===0?'th':'td'}>`).join('')+'</tr>').join('')+'</tbody></table>';continue}if(/^\s*[-*+]\s+/.test(line)){let a=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i]))a.push(lines[i++].replace(/^\s*[-*+]\s+/,''));out+='<ul>'+a.map(s=>`<li>${inline(s)}</li>`).join('')+'</ul>';continue}if(/^\s*\d+\.\s+/.test(line)){let a=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i]))a.push(lines[i++].replace(/^\s*\d+\.\s+/,''));out+='<ol>'+a.map(s=>`<li>${inline(s)}</li>`).join('')+'</ol>';continue}let p=[line];i++;while(i<lines.length&&lines[i].trim()&&!/^#{1,6}\s|^```|^>|^\s*\||^\s*[-*+]\s+|^\s*\d+\.\s+|^\s*---+\s*$/.test(lines[i]))p.push(lines[i++]);out+=`<p>${p.map(inline).join('<br>')}</p>`}return out}
    function getText(ch){if(!cache.has(ch.file))cache.set(ch.file,fetch('./book/'+encodeURIComponent(ch.file)).then(r=>{if(!r.ok)throw Error('无法读取章节');return r.text()}));return cache.get(ch.file)}
    function renderNav(filter=''){nav.innerHTML='';let last='';chapters.forEach((ch,i)=>{if(filter&&!(`${ch.part} ${ch.title}`.toLowerCase().includes(filter.toLowerCase())))return;if(ch.part!==last){last=ch.part;let li=document.createElement('li');li.className='nav-label';li.textContent=last;nav.append(li)}let li=document.createElement('li'),a=document.createElement('a');a.href='?chapter='+encodeURIComponent(ch.file);a.textContent=ch.title;a.className=i===current?'active':'';a.onclick=e=>{e.preventDefault();openChapter(i,true)};li.append(a);nav.append(li)})}
    function card(ch,i){return `<a class="chapter-card" href="?chapter=${encodeURIComponent(ch.file)}" data-index="${i}"><small>${esc(ch.part)}</small><strong>${esc(ch.title)}</strong></a>`}
    function home(){current=-1;crumb.textContent='在线阅读 · 工作稿';renderNav();const groups=[...new Set(chapters.map(c=>c.part))];content.innerHTML=`<section class="hero"><div class="eyebrow">Management · Agent + Human</div><span class="status">工作稿 · draft2.2</span><h1>管理学 2.0</h1><div class="subtitle">从管人到管理 Agent + 人。过去，管理者通过人完成工作；未来，管理者通过“人 + Agent 组成的组织系统”取得结果。</div>${status}</section><div class="intro-grid"><section class="intro-card"><h3>这本书在追问什么</h3><p>当执行者不再只有人，目标、分工、授权、绩效与责任这些管理学旧问题，要怎样重新回答？</p></section><section class="intro-card"><h3>阅读说明</h3><p>按序章、四部十六章与尾声阅读。你也可以用左侧搜索框查找概念或章节。</p></section></div>${groups.map(g=>`<h2 class="section-title">${esc(g)}</h2><div class="chapter-grid">${chapters.map((c,i)=>c.part===g?card(c,i):'').join('')}</div>`).join('')}<p class="article-meta" style="margin-top:38px">案例、引文与事实尚待最终核验。各章已附对应插图；下载版将在完成校订后补入。</p>`}
    async function openChapter(i,push){const ch=chapters[i];current=i;renderNav();crumb.textContent=ch.part+' · '+ch.title;content.innerHTML='<p>正在载入章节…</p>';try{let md=await getText(ch);let prev=chapters[i-1],next=chapters[i+1];content.innerHTML=`<header class="article-head"><div class="eyebrow">${esc(ch.part)}</div><h1>${esc(ch.title)}</h1><div class="article-meta">《管理学 2.0》工作稿 · draft2.2 · 第 ${i===0?'序章':i===17?'尾声':i} 篇</div></header><article class="prose">${renderMd(md)}</article><nav class="chapter-footer">${prev?`<a href="?chapter=${encodeURIComponent(prev.file)}" data-index="${i-1}">← 上一篇<br><strong>${esc(prev.title)}</strong></a>`:'<span></span>'}${next?`<a href="?chapter=${encodeURIComponent(next.file)}" data-index="${i+1}">下一篇 →<br><strong>${esc(next.title)}</strong></a>`:''}</nav>`;if(push)history.pushState({chapter:ch.file},'',`?chapter=${encodeURIComponent(ch.file)}`);window.scrollTo(0,0)}catch(e){content.innerHTML='<div class="empty">章节暂时无法载入。请从仓库目录打开 Markdown 正文。</div>'}}
    async function find(query){const q=query.trim().toLowerCase();if(!q){home();return}current=-1;crumb.textContent='全文搜索';renderNav(q);content.innerHTML='<p class="results-meta">正在搜索 18 篇章节…</p>';const rows=await Promise.all(chapters.map(async(ch,i)=>({ch,i,text:await getText(ch).catch(()=> '')})));const found=rows.filter(x=>(x.ch.part+' '+x.ch.title+' '+x.text).toLowerCase().includes(q));content.innerHTML=`<section class="hero"><div class="eyebrow">Full-text search</div><h1>搜索结果</h1><p class="results-meta">“${esc(query)}” · 找到 ${found.length} 篇相关章节</p></section>${found.length?`<div class="chapter-grid">${found.map(x=>card(x.ch,x.i)).join('')}</div>`:'<div class="empty">没有找到匹配内容。试试更短的关键词。</div>'}`;content.querySelectorAll('[data-index]').forEach(a=>a.onclick=e=>{e.preventDefault();search.value='';openChapter(Number(a.dataset.index),true)})}
    search.addEventListener('input',()=>find(search.value));window.addEventListener('popstate',()=>{let f=new URLSearchParams(location.search).get('chapter');let i=chapters.findIndex(c=>c.file===f);i<0?home():openChapter(i,false)});
    const initial=new URLSearchParams(location.search).get('chapter');const initialIndex=chapters.findIndex(c=>c.file===initial);initialIndex<0?home():openChapter(initialIndex,false);
  </script>
</body>
</html>
